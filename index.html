<style>
/* C&G Site Assistant: navy and olive from the logo, serif numerals, tab bar with icons. */
:root{box-sizing:border-box;color-scheme:light dark;
--bg:#f3f4f9;--cd:#ffffff;--tx:#14183a;--mu:#6a7090;--bd:#e3e6f0;--tint:#eceffa;
--ac:#1b2150;--onac:#ffffff;--green:#527421;--ok:#2d7a43;--bad:#b4352a;
--shadow:0 1px 2px rgba(20,24,58,.05),0 8px 24px rgba(20,24,58,.05);
--display:'Source Serif 4',Georgia,'Times New Roman',serif;
--ui:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--gut:max(16px,calc((100vw - 720px)/2));
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0e20;--cd:#141937;--tx:#eceefb;--mu:#9aa1c7;--bd:#242a4d;--tint:#1c2247;
--ac:#aab5ff;--onac:#10143a;--green:#a5cf6a;--ok:#7fd29a;--bad:#ff8f84;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14.5px/1.5 var(--ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:16px var(--gut) 28px;-webkit-overflow-scrolling:touch}
#top{display:none;align-items:center;gap:10px;padding:9px var(--gut);background:var(--cd);background:color-mix(in srgb,var(--cd) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:relative;z-index:2}
#top .mark{height:30px;width:auto;background:#fff;border-radius:9px;padding:3px 5px;border:1px solid var(--bd)}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font:600 18px var(--display);letter-spacing:.2px}
.brand span{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600;white-space:nowrap}
#who{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mu)}
.hero{display:block;width:min(250px,68%);margin:20px auto 18px;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid2 .card{margin:0;padding:13px 12px}.grid2 .big{font-size:clamp(24px,6vw,34px);overflow-wrap:anywhere}@media(max-width:420px){.grid2{gap:7px}.grid2 .card{padding:11px 9px}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mu{color:var(--mu);font-size:12.5px}
.big{font:600 36px/1.1 var(--display);letter-spacing:-.5px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.err{color:var(--bad);font-size:13px}
h3{margin:2px 0 10px;font:600 19px/1.25 var(--display);letter-spacing:.1px}
.card>b:first-child,.card>.row>b{font-weight:600}
p{margin:8px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:9px 0;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child{text-align:right;white-space:nowrap}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
details{margin-top:8px}
summary{color:var(--mu);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--mu);vertical-align:middle}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
a,.card a{color:var(--ac);cursor:pointer;text-decoration:none;font-weight:600}
a[href]{text-decoration:underline;text-underline-offset:3px}
button{font:600 13.5px var(--ui);border:0;border-radius:12px;background:var(--ac);color:var(--onac);padding:11px 18px;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:10px 16px}
button.s{padding:7px 13px;font-size:12.5px;border-radius:10px}
button.g.s{padding:6px 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.card .bar{margin:12px 0 0}
input,select,textarea{width:100%;padding:12px 14px;margin:0 0 8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:400 16px var(--ui)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input.n{width:92px;margin:0;text-align:right;padding:7px 9px;font-size:15px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{margin:0;color:var(--tx);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;border:1px solid var(--bd);border-radius:99px;padding:7px 13px;background:var(--bg)}
.chips input{display:none}
.chips label.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.rem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tint);color:var(--tx);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:13px;font-weight:500}
.rem::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--green)}
.rem span{flex:1}.rem a{opacity:.6}
#warn,#rems{padding:0 var(--gut)}#warn:not(:empty),#rems:not(:empty){padding-top:10px}
nav{display:flex;align-items:center;gap:8px;background:var(--cd);border-top:1px solid var(--bd);padding:8px var(--gut);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#appnav{display:block;width:100%;min-width:0;margin:0;font-size:14px;padding:12px 14px;border-radius:14px;font-weight:600}
nav #navask{display:none}
#aifab{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* AI assistant */
#aifab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;display:none;align-items:center;gap:6px;padding:12px 20px;border-radius:99px;box-shadow:0 6px 20px rgba(20,24,58,.28)}
#ai{position:fixed;inset:0;height:100dvh;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#ai[hidden]{display:none}
.aih{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px var(--gut);background:var(--cd);border-bottom:1px solid var(--bd)}
.aih b{font:600 18px var(--display)}
#aim{flex:1;overflow-y:auto;padding:14px var(--gut);display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const wkStart=(d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const wkEnd=w=>{const x=new Date(w+'T12:00');x.setDate(x.getDate()+6);return iso(x)};
const gbp=n=>(n<0?'-':'')+'£'+Math.abs(Number(n||0)).toLocaleString('en-GB',{maximumFractionDigits:2});
const CFG=window.APP_CONFIG||{};let sb=null;try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){console.error(e)}
let FM=null,tab='today',mode='boot',ME=null,PROFS=[],OPS={tasks:[],checks:[],calendar:[]},PAYL=[],MYDET=null,JOINC='',FIT=null,authTab='in',cloudOK=false,dirty=false,saveT,stT;
let S={emps:[],jobs:[],days:[],costs:[],inc:[],notes:[],rem:[],sor:[],quotes:[],paid:[],cp:[],calendar:[],audit:[],biz:{name:'',phone:'',vat:0},qn:0};
let CLIENT=null, CLIENT_PROJECTS=[], CLIENT_UPDATES={}, CLIENT_PHOTOS={};
const ensureS=()=>{['emps','jobs','days','costs','inc','notes','rem','sor','quotes','paid','cp','calendar','audit'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.biz)S.biz={name:'',phone:'',vat:0};S.qn=S.qn||0;delete S.chat};
const stat=t=>{$('#warn').innerHTML=t?'<div class="rem"><span>'+t+'</span></div>':'';clearTimeout(stT);if(t&&t[0]==='✓')stT=setTimeout(()=>stat(''),2000)};
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,250)}
function auditPayroll(action,detail){S.audit=S.audit||[];S.audit.unshift({id:uid(),at:new Date().toISOString(),action,detail:String(detail||'')});S.audit=S.audit.slice(0,100)}
async function flush(){clearTimeout(saveT);if(mode!=='owner'||!dirty)return;
if(!cloudOK){stat('Not saved – could not reach the database. Reload the page.');return}
try{localStorage.setItem('biz',JSON.stringify(S))}catch(e){}
try{const{error}=await sb.from('biz_state').upsert({id:1,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});if(error)throw error;dirty=false;stat('✓ Saved');syncPay()}catch(e){stat('Save failed: '+(e.message||e))}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
// downloads (works on normal hosting)
const DL={save:async({filename,data})=>{const b=new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'–';
const fdt=d=>new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ftm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

const E=id=>S.emps.find(e=>e.id===id),J=id=>S.jobs.find(j=>j.id===id);
const wage=d=>d.rate*d.frac;
const inWk=(d,w=wkStart())=>d.date>=w&&d.date<=wkEnd(w);
function owed(w=wkStart()){return S.emps.map(e=>{const ds=S.days.filter(d=>d.emp===e.id&&inWk(d,w));return{e,days:ds.reduce((a,d)=>a+d.frac,0),amt:ds.reduce((a,d)=>a+wage(d),0)}})}
function jobFin(j){const w=S.days.filter(d=>d.job===j.id).reduce((a,d)=>a+wage(d),0),c=S.costs.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0),i=S.inc.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0);return{w,c,i,profit:i-w-c}}
function totals(){const wk=wkStart(),wages=owed().reduce((a,o)=>a+o.amt,0),costs=S.costs.filter(c=>inWk(c,wk)).reduce((a,c)=>a+c.amt,0);
const aw=S.days.reduce((a,d)=>a+wage(d),0),ac=S.costs.reduce((a,c)=>a+c.amt,0),ai=S.inc.reduce((a,c)=>a+c.amt,0);return{wages,costs,out:wages+costs,profit:ai-aw-ac,income:ai}}
const findJ=n=>S.jobs.find(j=>[j.name,j.address,j.client].filter(Boolean).some(s=>{s=s.toLowerCase();n=(n||'').toLowerCase().trim();return n&&(s.includes(n)||n.includes(s))}));
// ---- pay: Monday-Friday cutoff; weekend shifts roll into the next week's period; Friday pay run with week in hand
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const wkOf=d=>{const x=new Date(d+'T12:00');if(x.getDay()===6)x.setDate(x.getDate()+2);else if(x.getDay()===0)x.setDate(x.getDate()+1);return wkStart(x)};
const payDateOf=ws=>addD(ws,18);
const nextPay=(from=today())=>{const x=new Date(from+'T12:00');x.setDate(x.getDate()+((5-x.getDay()+7)%7));return iso(x)};
const isPaid=(eid,ws)=>S.paid.some(p=>p.emp===eid&&p.ws===ws);
function weeksOf(eid){const m={};S.days.filter(d=>d.emp===eid).forEach(d=>{const ws=wkOf(d.date),w=m[ws]||(m[ws]={ws,days:0,amt:0});w.days+=d.frac;w.amt+=wage(d)});return Object.values(m).sort((a,b)=>a.ws<b.ws?-1:1)}
function payInfo(e,asOf=today()){const np=nextPay(asOf),nextWs=addD(np,-18);
const wk=weeksOf(e.id).map(w=>({...w,pay:payDateOf(w.ws),paid:isPaid(e.id,w.ws)})),up=wk.filter(w=>!w.paid),due=up.filter(w=>w.ws<=nextWs),held=up.filter(w=>w.ws>nextWs),sum=a=>a.reduce((x,w)=>x+w.amt,0);
const dts=S.days.filter(d=>d.emp===e.id).map(d=>d.date).sort(),startDt=e.start||dts[0]||'';
return{wk,up,due,held,dueAmt:sum(due),heldAmt:sum(held),np,startDt,firstPay:startDt?payDateOf(wkOf(startDt)):'',overdue:sum(up.filter(w=>w.pay<asOf))}}
function payRun(){const t=today();let dueAmt=0,heldAmt=0,overdue=0,n=0;S.emps.forEach(e=>{const i=payInfo(e);dueAmt+=i.dueAmt;heldAmt+=i.heldAmt;overdue+=i.overdue;if(i.dueAmt>0)n++});return{np:nextPay(t),dueAmt,heldAmt,overdue,n}}
const payRows=()=>S.emps.map(e=>{const i=payInfo(e);return{Name:e.name,Active:e.active!==false,'Start date':i.startDt,'First pay date':i.firstPay,'Next pay date':i.np,'Paid on next run':i.dueAmt,'Held after next run':i.heldAmt,'Total held now':i.dueAmt+i.heldAmt}});
const empCanPay=e=>S.emps.some(x=>x.id===e.id);
function markPaid(eid,all){const e=E(eid),i=payInfo(e),rows=all?i.up:i.due,amt=rows.reduce((a,w)=>a+w.amt,0);rows.forEach(w=>S.paid.push({id:uid(),emp:eid,ws:w.ws,amt:w.amt,on:today()}));if(rows.length)auditPayroll('Marked paid',`${e?.name||'Worker'} · ${gbp(amt)} · ${rows.length} payroll week(s)`);save();render()}
function unPay(id){const p=S.paid.find(x=>x.id===id);if(p)auditPayroll('Payment record undone',`${E(p.emp)?.name||'Worker'} · ${gbp(p.amt)} · week of ${p.ws}`);S.paid=S.paid.filter(p=>p.id!==id);save();render()}
async function syncPay(){if(mode!=='owner')return;try{const links=PROFS.filter(p=>p.emp_id&&E(p.emp_id)),ids=links.map(p=>p.id);if(!ids.length)return;
const rows=[];links.forEach(p=>{const e=E(p.emp_id),i=payInfo(e);i.wk.forEach(w=>rows.push({user_id:p.id,week_start:w.ws,days:w.days,amount:w.amt,pay_date:w.pay,status:w.paid?'paid':(w.ws<=addD(i.np,-18)?'due':'held')}))});
if(rows.length){const{error}=await sb.from('pay_lines').upsert(rows,{onConflict:'user_id,week_start'});if(error)throw error}
const existing=await sb.from('pay_lines').select('user_id,week_start').in('user_id',ids);if(existing.error)throw existing.error;const keep=new Set(rows.map(r=>r.user_id+'|'+r.week_start));for(const row of existing.data||[]){if(!keep.has(row.user_id+'|'+row.week_start)){const{error}=await sb.from('pay_lines').delete().eq('user_id',row.user_id).eq('week_start',row.week_start);if(error)throw error}}}catch(e){console.error('syncPay',e);stat('Payroll portal sync needs attention: '+(e.message||e))}}
// ---- reminders (owner)
function reminders(){const r=[],t=today();
S.rem.filter(x=>x.date<=t).forEach(x=>r.push({t:''+x.text,id:x.id}));
const pr=payRun();if(pr.overdue>0)r.push({t:`Pay overdue: ${gbp(pr.overdue)} – see Pay tab`});else if(pr.dueAmt>0&&(pr.np===t||addD(pr.np,-1)===t))r.push({t:`Pay run ${pr.np===t?'today':'tomorrow'}: ${gbp(pr.dueAmt)} to ${pr.n} people`});
const pend=PROFS.filter(p=>p.role==='operative'&&!p.approved).length;if(pend)r.push({t:`${pend} new login(s) to approve (Team tab)`});
const ap=OPS.checks.filter(c=>c.out_at&&!c.approved&&!c.rejected).length;if(ap)r.push({t:`${ap} check-in(s) to approve (Tasks tab)`});
S.emps.filter(e=>!e.rate&&e.active!==false).forEach(e=>r.push({t:`❓ ${e.name} has no day rate`}));
S.emps.filter(e=>!e.start&&e.active!==false).forEach(e=>r.push({t:`${e.name} has no start date`}));
S.jobs.filter(j=>j.status==='new').forEach(j=>r.push({t:`"${j.name}" is a new job – needs quote/details`}));
S.jobs.filter(j=>j.status==='complete'&&j.quote>jobFin(j).i).forEach(j=>r.push({t:`${j.name} complete – ${gbp(j.quote-jobFin(j).i)} still to collect`}));
S.quotes.filter(q=>q.status==='sent'&&q.sent<=iso(Date.now()-3*864e5)).forEach(q=>r.push({t:`Quote ${q.ref} (${q.client}) sent 3+ days ago – chase?`}));
S.emps.forEach(e=>[['cscsx','CSCS card'],['ins','Insurance']].forEach(([k,l])=>{if(e[k]&&e[k]<=iso(Date.now()+30*864e5))r.push({t:`${e.name}: ${l} ${e[k]<today()?'expired':'expires'} ${e[k]}`})}));return r}
// ---- sign in / loading
async function boot(){if(!sb||!CFG.SUPABASE_URL||/YOUR-/.test(CFG.SUPABASE_URL)){mode='setup';return render()}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){mode='recover';render()}});
const{data:{session}}=await sb.auth.getSession();if(!session){mode='auth';return render()}await enter(session.user)}
async function enter(user){stat('Loading…');
try{const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;
if(data){ME=data;CLIENT=null;if(ME.role==='owner'){mode='owner';await loadOwner();tab='home'}else{await loadOp();await loadCalendar();if(!onboardingComplete(MYDET&&MYDET.data)){mode='onboarding';tab='onboarding'}else if(ME.approved){mode='operative';tab='mytasks'}else mode='pending'}}
else{const{data:ca,error:ce}=await sb.from('client_accounts').select('*').eq('id',user.id).maybeSingle();if(ce)throw ce;if(!ca)throw new Error('This login has no profile. Please contact C&G.');CLIENT=ca;ME={id:ca.id,email:ca.email,full_name:ca.full_name,role:'client',approved:ca.approved};if(ca.approved){mode='client';tab='clientportal';await loadClientProjects()}else{mode='clientpending';tab='clientportal'}}
stat('')}catch(e){stat(''+(e.message||e));mode='auth'}render()}
async function loadOwner(){const r=await sb.from('biz_state').select('data').eq('id',1).maybeSingle();cloudOK=!r.error;if(r.error)stat(''+r.error.message);

function homeView(){
const v=$('#view'),t=today(),ws=wkStart(),we=wkEnd(ws),jobs=S.jobs||[],active=jobs.filter(j=>j.status!=='complete'),complete=jobs.filter(j=>j.status==='complete');
const receivedWeek=S.inc.filter(x=>x.date>=ws&&x.date<=we).reduce((a,x)=>a+(+x.amt||0),0);
const costsWeek=S.costs.filter(x=>x.date>=ws&&x.date<=we).reduce((a,x)=>a+(+x.amt||0),0);
const wagesWeek=S.days.filter(x=>x.date>=ws&&x.date<=we).reduce((a,x)=>a+wage(x),0);
const weekProfit=receivedWeek-costsWeek-wagesWeek;
const allReceived=S.inc.reduce((a,x)=>a+(+x.amt||0),0),allWages=S.days.reduce((a,x)=>a+wage(x),0),allCosts=S.costs.reduce((a,x)=>a+(+x.amt||0),0);
const outstanding=jobs.reduce((a,j)=>a+Math.max(0,(+j.quote||0)-S.inc.filter(x=>x.job===j.id).reduce((b,x)=>b+(+x.amt||0),0)),0);
const live=OPS.checks.filter(c=>!c.out_at),ending=active.filter(j=>j.end_date&&j.end_date>=t&&j.end_date<=addD(t,14)).sort((a,b)=>a.end_date.localeCompare(b.end_date));
const quoteDrafts=S.quotes.filter(q=>q.status==='draft'||q.status==='sent');
const jobCards=active.slice().sort((a,b)=>(a.end_date||'9999').localeCompare(b.end_date||'9999')).slice(0,6);
v.innerHTML=`<div class="row"><div><h3>Business overview</h3><div class="mu">${fdate(ws)} – ${fdate(we)}</div></div><button class="g s" onclick="render()">Refresh</button></div>
<div class="grid2"><div class="card"><div class="mu">Money received this week</div><div class="big">${gbp(receivedWeek)}</div><div class="mu">Payments actually logged</div></div><div class="card"><div class="mu">Operating result this week</div><div class="big ${weekProfit<0?'bad':'ok'}">${gbp(weekProfit)}</div><div class="mu">Received − recorded wages − outgoings</div></div><div class="card"><div class="mu">Outstanding project balances</div><div class="big">${gbp(outstanding)}</div><div class="mu">Based on agreed job prices less payments logged</div></div><div class="card"><div class="mu">Active projects</div><div class="big">${active.length}</div><div class="mu">${complete.length} completed</div></div></div>
<div class="bar"><button onclick="jobForm()">+ New project</button><button onclick="newQ()">+ New quotation</button><button class="g" onclick="moneyForm('costs')">+ Record outgoing</button><button class="g" onclick="moneyForm('inc')">+ Payment received</button></div>
<div class="card"><h3>Projects</h3>${jobCards.length?jobCards.map(j=>{const f=jobFin(j),paid=S.inc.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0),balance=Math.max(0,(+j.quote||0)-paid);return`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="row"><b>${esc(j.name)}</b><span class="tag">${esc(j.status)}</span></div><div class="mu">${esc([j.client,j.address].filter(Boolean).join(' · ')||'No client/address added')}</div><div class="row"><span class="mu">Agreed ${gbp(j.quote)} · balance ${gbp(balance)}</span><span class="mu">${j.end_date?'Finish '+fdate(j.end_date):'No finish date'}</span></div><div class="mu">Received ${gbp(f.i)} · recorded costs ${gbp(f.w+f.c)}</div><div class="bar"><button class="g s" onclick="jobForm('${j.id}')">Edit project</button><button class="g s" onclick="moneyForm('costs','','${j.id}')">+ Cost</button><button class="g s" onclick="moneyForm('inc','','${j.id}')">+ Payment</button></div></div>`}).join(''):'<p class="mu">No projects yet. Create one here or accept a quotation to turn it into a project.</p>'}<p><a onclick="tab='jobs';render()">View all projects →</a></p></div>
<div class="card"><h3>Operatives on site now (${live.length})</h3>${live.length?live.map(c=>{const p=PROFS.find(x=>x.id===c.user_id),e=p&&E(p.emp_id);return`<div class="row"><span><b>${esc((e&&e.name)||(p&&p.full_name)||'Operative')}</b><br><span class="mu">${esc(c.job_name||'Project')} · since ${ftm(c.in_at)}</span></span><span class="tag ok">On site</span></div>`}).join('<hr>'):'<p class="mu">No live check-ins right now. Operatives appear here when they check in through the app.</p>'}<p><a onclick="tab='tasks';render()">Attendance & tasks →</a></p></div>
<div class="card"><h3>Coming to an end (next 14 days)</h3>${ending.length?ending.map(j=>`<div class="row"><span><b>${esc(j.name)}</b><br><span class="mu">${esc(j.client||'')} · target ${fdate(j.end_date)}</span></span><button class="g s" onclick="jobForm('${j.id}')">Update</button></div>`).join('<hr>'):'<p class="mu">Add a target finish date to projects to see them listed here.</p>'}</div>
<div class="card"><h3>Quotations needing attention (${quoteDrafts.length})</h3>${quoteDrafts.length?quoteDrafts.slice().reverse().slice(0,5).map(q=>`<div class="row" style="margin:7px 0"><span><b>${q.ref} · ${esc(q.client)}</b><br><span class="mu">${esc(q.address||'')} · ${q.status}</span></span><span>${gbp(qTot(q).total)}<br><a onclick="tab='quotes';qv='${q.id}';render()">Open →</a></span></div>`).join(''):'<p class="mu">No draft or sent quotations.</p>'}<p><a onclick="tab='quotes';render()">All quotations →</a></p></div>
<div class="card"><h3>Company totals (all time)</h3><table><tr><td>Payments received</td><td>${gbp(allReceived)}</td></tr><tr><td>Recorded wages</td><td>${gbp(allWages)}</td></tr><tr><td>All recorded outgoings / overheads</td><td>${gbp(allCosts)}</td></tr><tr><td><b>Operating profit so far</b></td><td class="${allReceived-allWages-allCosts<0?'bad':'ok'}"><b>${gbp(allReceived-allWages-allCosts)}</b></td></tr></table><p class="mu">Record every company outgoing under Money, including overheads not tied to a project. Do not enter the same expense twice. This is a cash/recorded-cost view, not an accounts or tax statement.</p><p><a onclick="tab='money';render()">Open money & outgoings →</a></p></div>`;

// WhatsApp job intake: paste one or more messages, review the extracted fields, then save drafts.
function waParseOne(raw){
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const get=(re)=>{for(const l of lines){const m=l.match(re);if(m)return (m[1]||'').trim()}return ''};
 const name=get(/^(?:job|project|job name|works)\s*[:\-–]\s*(.+)$/i) || lines.find(l=>!/^https?:\/\//i.test(l) && !/^(client|customer|address|location|site address|price|quote|value|finish|finish date|due|date|trade|skills|worker|operative)\s*[:\-–]/i.test(l)) || 'WhatsApp job – review details';
 const client=get(/^(?:client|customer)\s*[:\-–]\s*(.+)$/i);
 const address=get(/^(?:address|location|site address|site)\s*[:\-–]\s*(.+)$/i);
 const priceText=get(/^(?:price|quote|value|agreed price|job value)\s*[:\-–]\s*£?\s*([\d,]+(?:\.\d{1,2})?)/i) || ((raw.match(/(?:£\s?)([\d,]+(?:\.\d{1,2})?)/)||[])[1]||'');
 let finish=get(/^(?:finish|finish date|due|target date|date)\s*[:\-–]\s*(.+)$/i), end='';
 if(finish){let m=finish.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);if(m){let y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):new Date().getFullYear();end=`${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}else{let d=new Date(finish);if(!isNaN(d))end=iso(d)}}
 const skills=get(/^(?:trade|skills|workers needed|operative)\s*[:\-–]\s*(.+)$/i);
 return {name,client,address,quote:priceText.replace(/,/g,''),end_date:end,needs:skills,raw};
}

 d.innerHTML=`<div style="background:var(--bg,#fff);color:var(--tx,#171a2c);border:1px solid var(--bd,#ddd);border-radius:16px;padding:18px;width:min(760px,100%);margin:4vh auto;box-shadow:0 18px 60px #0004"><div class="row"><h2 style="margin:0">Import jobs from WhatsApp</h2><button class="g s" onclick="waClose()">Close</button></div><p class="mu">Paste the message from WhatsApp below. Keep labels such as Client:, Address:, Price: and Finish date: where possible. Separate multiple jobs with a line containing <b>---</b>. Nothing is saved until you review and confirm.</p><label for="waRaw">WhatsApp message(s)</label><textarea id="waRaw" rows="8" style="width:100%;box-sizing:border-box" placeholder="Job: Kitchen refurb\nClient: Smith\nAddress: 12 High Street, London\nPrice: £4,500\nFinish date: 25/10/2026\nTrade: Carpentry, plumbing"></textarea><div class="bar"><button onclick="waPreview()">Extract job details</button><button class="g" onclick="document.getElementById('waRaw').value='';document.getElementById('waPreview').innerHTML=''">Clear</button></div><div id="waPreview"></div></div>`;

}

const aiSys=()=>`You are the assistant built into the site-management app of C&G Residential Services (a property maintenance / building trades business in Essex and East London). You are talking to Evan, a co-director, usually on his phone. Today is ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} (${today()}).

Your job is to do his daily admin for him by calling the tools: log days worked, record costs and payments, create and update jobs, build and update quotes, add notes and reminders, check what is owed, approve check-ins, send tasks to the team. Payroll is a priority: whenever Evan tells you who worked, where they worked, and when, call log_days immediately so the payroll ledger updates. A normal message like 'Log Dan and Lee at Oak Road yesterday' means one full day each, unless he specifies half-days or another duration. If the worker, job/site, or date is ambiguous or missing, ask one short clarifying question instead of guessing. For several workers on the same job/date, log them together. For different dates or jobs, call log_days separately. Confirm the worker names, site and date after the tool succeeds.

Rules:
- Use British English, £, and short plain replies that read well on a phone. No long preambles, no tables.
- Do what was asked straight away. If several things are in one message, do them all, then reply with a one or two line summary.
- Never guess. If a worker, job, amount or date is missing or ambiguous, ask ONE short question. Work out dates like "yesterday" or "Monday" from today's date.
- Never invent prices. For quotes, call search_rates and use the exact rate names so prices come from his schedule of rates. If an item has no rate, ask him for the price. Tell him about any lines that could not be added.
- INSTANT ESTIMATES: when he describes a job and wants an estimate, quote or price, just build it. Call search_rates for every item (several calls at once), then create_quote with all lines (labour only unless he says you supply materials), then call estimate_pdf so a Download PDF button appears. Reply with the total in one or two lines and list any lines you could not price. If he gives no customer name use Customer (TBC). Use his own words for rooms.
- PRICE MEMORY: for a named customer call client_prices before pricing so you know what they paid before. When he lowers a price or gives a discount use update_quote_line (the original price is remembered automatically) - never retype the line. For a repeat customer tell him what was charged the first time, the latest price and the standard rate, and ask which to use unless he has already said. After a discount reply with the original and the new price.
- Only say something is done if the tool result says ok. If a tool returns an error, say what went wrong in plain words.
- mark_paid only when he clearly says he has paid someone.
- You cannot delete anything, approve new logins or change site locations. If asked, tell him where in the app to do it.
- When he asks what needs doing, call lookup with today_summary and give the few things that matter, most urgent first.

async function swUpload(file,folder){
  if(!file)return null;
  if(file.size>12*1024*1024)throw new Error('Images and receipts must be 12 MB or smaller.');

  const path=`${ME.id}/${folder}/${Date.now()}_${uid()}.${ext}`;
  const {error}=await sb.storage.from('site-evidence').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
  if(error)throw error;
  return {path};
}

      ? 'Write a RAMS (risk assessment and method statement summary) with these sections: ## Job details; ## Hazards and risk assessment (a table with columns Hazard | Who is at risk | Controls | Risk before | Risk after, covering every realistic hazard for this scope such as working at height, manual handling, dust and RPE, noise and vibration, tools and electrics, hazardous substances/COSHH, slips and trips, asbestos in older buildings, working in occupied homes, fire, waste); ## PPE required; ## COSHH and substances; ## Welfare, first aid and emergency arrangements; ## Stop-work triggers; ## Operative sign-off.'

    const r = _render.apply(this, arguments);
    // the app may have logged in before this file loaded: fetch our data once, then redraw
    if (mode === 'operative' && !PT.loaded && !PT.loading) { PT.loading = 1; pLoad().then(() => { PT.loading = 0; render(); }); }
    if (mode === 'owner' && !PV.adm.tried && !PV.adm.loading) { PV.adm.loading = 1; pAdmLoad().then(() => { PV.adm.loading = 0; render(); setTimeout(pAuto, 1500); }); }
    if (FM) return r;
    if (mode === 'pending') {
      if (PV.ct && CT.mine.find(x => x.id === PV.ct)) return ctPage();
      PV.ct = null;
      const v = $('#view'); if (v) v.insertAdjacentHTML('beforeend', ctCard() + ctListCard());
      if (!CT.loaded && !CT.loading) { CT.loading = 1; ctLoad().then(() => { CT.loading = 0; if (mode === 'pending') render(); }); }
      return r;
    }
    if (mode === 'operative' && PV.ct) { if (CT.mine.find(x => x.id === PV.ct)) return ctPage(); PV.ct = null; }
    if (mode === 'operative' && MYTABS.includes(tab)) {
      if (tab === 'mydash') return dashView();
      if (tab === 'myjobs') { const t = PV.openTask && myTasks().find(x => x.id === PV.openTask); if (PV.doc) return docPage(); if (t) return jobPage(t); PV.openTask = null; return jobsList(); }
      if (tab === 'mydocs') return PV.doc ? docPage() : libraryView();
    }
    if (mode === 'operative' && PV.doc && (tab === 'myjobs' || tab === 'mydash')) return docPage();
    if (mode === 'owner') {
      if (tab === 'portal') return PV.edit ? editorView() : adminView();
      if (tab === 'tasks' || tab === 'home') ownerBanner();
    }
    return r;
  };
  $('#nav').addEventListener('click', () => { PV.ct = null; PV.openTask = null; PV.doc = null; PV.edit = null; PV.back = null; }, true);

  // keep the operative screens fresh without wiping what is being typed or the map
  setInterval(async () => {
    try {
      if (mode !== 'operative' || document.hidden || FM || PV.doc || PV.ct || PV.map || !MYTABS.includes(tab) || tab === 'mypay' || tab === 'mydetails') return;
      if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
      await loadOp(); render();
    } catch (e) { }
  }, 60000);

  // if the app finished logging in before this file loaded, redraw now with the portal screens
  if (mode === 'operative' || mode === 'owner') { try { render(); } catch (e) { console.error(e); } }
})();

</script></body></html>
