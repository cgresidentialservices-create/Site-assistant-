<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#d9730d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Site Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{box-sizing:border-box;--bg:#f5f4ef;--cd:#fff;--tx:#1c1c1a;--mu:#6c6b64;--ac:#d9730d;--bd:#e3e1d8;--ok:#2e7d4f;--bad:#c0392b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--cd:#232321;--tx:#f1f0ea;--mu:#9d9c93;--bd:#383835;--ok:#5fc08a;--bad:#ef7c6e}}
:root[data-theme="dark"]{--bg:#171716;--cd:#232321;--tx:#f1f0ea;--mu:#9d9c93;--bd:#383835;--ok:#5fc08a;--bad:#ef7c6e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
h3{margin:4px 0 8px;font-size:15px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.a{background:var(--cd);border:1px solid var(--bd);border-bottom-left-radius:4px}
#comp{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);background:var(--bg);align-items:flex-end}
#comp textarea{flex:1;resize:none;max-height:100px;border:1px solid var(--bd);border-radius:18px;padding:9px 12px;background:var(--cd);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:18px;background:var(--ac);color:#fff;padding:9px 14px}
button.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd);padding:9px 12px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--cd)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 0;font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
.rem{background:#fff4e0;color:#5a3500;border-radius:10px;padding:8px 10px;margin:0 12px 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
@media(prefers-color-scheme:dark){.rem{background:#3a2a10;color:#ffd9a0}}
.rem a{opacity:.7}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--bd)}td:last-child{text-align:right}
details{margin-top:6px}summary{color:var(--mu);font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--bd);color:var(--mu)}
.thumbs{font-size:12px;color:var(--mu);padding:0 12px}
input,select,textarea{width:100%;padding:9px 12px;margin:0 0 6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input.n{width:84px;margin:0;text-align:right;padding:6px 8px}
nav button{font-size:12px}.card a{cursor:pointer;color:var(--mu)}
#comp textarea{margin:0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{margin:0;color:var(--tx);font-size:14px;border:1px solid var(--bd);border-radius:16px;padding:6px 11px;background:var(--bg)}
.chips input{display:none}.chips label.on{background:var(--ac);color:#fff;border-color:var(--ac)}.err{color:var(--bad)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.card .bar{margin:8px 0 0}button.s{padding:5px 11px;font-size:13px}
#top{display:none;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--cd)}#top b{flex:1}#top button{padding:5px 11px;font-size:13px}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}a[href]{color:var(--ac)}hr{border:0;border-top:1px solid var(--bd);margin:8px 0}
button:disabled{opacity:.5}

</style></head><body>
<div id="top"><b>C&amp;G Site Assistant</b><span id="who" class="mu"></span><button class="g" id="so">Sign out</button></div>
<div id="warn"></div><div id="rems"></div>
<div id="view"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const wkStart=(d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const wkEnd=w=>{const x=new Date(w+'T12:00');x.setDate(x.getDate()+6);return iso(x)};
const gbp=n=>(n<0?'-':'')+'£'+Math.abs(Number(n||0)).toLocaleString('en-GB',{maximumFractionDigits:2});
const CFG=window.APP_CONFIG||{};let sb=null;try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){console.error(e)}
let FM=null,tab='today',mode='boot',ME=null,PROFS=[],OPS={tasks:[],checks:[]},PAYL=[],MYDET=null,JOINC='',FIT=null,authTab='in',cloudOK=false,dirty=false,saveT,stT;
let S={emps:[],jobs:[],days:[],costs:[],inc:[],notes:[],rem:[],sor:[],quotes:[],paid:[],biz:{name:'',phone:'',vat:0},qn:0};
const ensureS=()=>{['emps','jobs','days','costs','inc','notes','rem','sor','quotes','paid'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.biz)S.biz={name:'',phone:'',vat:0};S.qn=S.qn||0;delete S.chat};
const stat=t=>{$('#warn').innerHTML=t?'<div class="rem"><span>'+t+'</span></div>':'';clearTimeout(stT);if(t&&t[0]==='✓')stT=setTimeout(()=>stat(''),2000)};
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){clearTimeout(saveT);if(mode!=='owner'||!dirty)return;
if(!cloudOK){stat('⚠️ Not saved – could not reach the database. Reload the page.');return}
try{localStorage.setItem('biz',JSON.stringify(S))}catch(e){}
try{const{error}=await sb.from('biz_state').upsert({id:1,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});if(error)throw error;dirty=false;stat('✓ Saved');syncPay()}catch(e){stat('⚠️ Save failed: '+(e.message||e))}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
// downloads (works on normal hosting)
const DL={save:async({filename,data})=>{const b=new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'–';
const fdt=d=>new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ftm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

const E=id=>S.emps.find(e=>e.id===id),J=id=>S.jobs.find(j=>j.id===id);
const wage=d=>d.rate*d.frac;
const inWk=(d,w=wkStart())=>d.date>=w&&d.date<=wkEnd(w);
function owed(w=wkStart()){return S.emps.map(e=>{const ds=S.days.filter(d=>d.emp===e.id&&inWk(d,w));return{e,days:ds.reduce((a,d)=>a+d.frac,0),amt:ds.reduce((a,d)=>a+wage(d),0)}})}
function jobFin(j){const w=S.days.filter(d=>d.job===j.id).reduce((a,d)=>a+wage(d),0),c=S.costs.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0),i=S.inc.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0);return{w,c,i,profit:i-w-c}}
function totals(){const wk=wkStart(),wages=owed().reduce((a,o)=>a+o.amt,0),costs=S.costs.filter(c=>inWk(c,wk)).reduce((a,c)=>a+c.amt,0);
const aw=S.days.reduce((a,d)=>a+wage(d),0),ac=S.costs.reduce((a,c)=>a+c.amt,0),ai=S.inc.reduce((a,c)=>a+c.amt,0);return{wages,costs,out:wages+costs,profit:ai-aw-ac,income:ai}}
const findJ=n=>S.jobs.find(j=>[j.name,j.address,j.client].filter(Boolean).some(s=>{s=s.toLowerCase();n=(n||'').toLowerCase().trim();return n&&(s.includes(n)||n.includes(s))}));
// ---- pay: work Mon–Sun week, paid the Friday of the FOLLOWING week (week in hand)
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const wkOf=d=>wkStart(new Date(d+'T12:00'));
const payDateOf=ws=>addD(ws,11);
const nextPay=(from=today())=>{const x=new Date(from+'T12:00');x.setDate(x.getDate()+((5-x.getDay()+7)%7));return iso(x)};
const isPaid=(eid,ws)=>S.paid.some(p=>p.emp===eid&&p.ws===ws);
function weeksOf(eid){const m={};S.days.filter(d=>d.emp===eid).forEach(d=>{const ws=wkOf(d.date),w=m[ws]||(m[ws]={ws,days:0,amt:0});w.days+=d.frac;w.amt+=wage(d)});return Object.values(m).sort((a,b)=>a.ws<b.ws?-1:1)}
function payInfo(e,asOf=today()){const np=nextPay(asOf),nextWs=addD(np,-11);
const wk=weeksOf(e.id).map(w=>({...w,pay:payDateOf(w.ws),paid:isPaid(e.id,w.ws)})),up=wk.filter(w=>!w.paid),due=up.filter(w=>w.ws<=nextWs),held=up.filter(w=>w.ws>nextWs),sum=a=>a.reduce((x,w)=>x+w.amt,0);
const dts=S.days.filter(d=>d.emp===e.id).map(d=>d.date).sort(),startDt=e.start||dts[0]||'';
return{wk,up,due,held,dueAmt:sum(due),heldAmt:sum(held),np,startDt,firstPay:startDt?payDateOf(wkOf(startDt)):'',overdue:sum(up.filter(w=>w.pay<asOf))}}
function payRun(){const t=today();let dueAmt=0,heldAmt=0,overdue=0,n=0;S.emps.forEach(e=>{const i=payInfo(e);dueAmt+=i.dueAmt;heldAmt+=i.heldAmt;overdue+=i.overdue;if(i.dueAmt>0)n++});return{np:nextPay(t),dueAmt,heldAmt,overdue,n}}
const payRows=()=>S.emps.map(e=>{const i=payInfo(e);return{Name:e.name,Active:e.active!==false,'Start date':i.startDt,'First pay date':i.firstPay,'Next pay date':i.np,'Paid on next run':i.dueAmt,'Held after next run':i.heldAmt,'Total held now':i.dueAmt+i.heldAmt}});
const empCanPay=e=>S.emps.some(x=>x.id===e.id);
function markPaid(eid,all){const e=E(eid),i=payInfo(e);(all?i.up:i.due).forEach(w=>S.paid.push({id:uid(),emp:eid,ws:w.ws,amt:w.amt,on:today()}));save();render()}
function unPay(id){S.paid=S.paid.filter(p=>p.id!==id);save();render()}
async function syncPay(){if(mode!=='owner')return;try{const links=PROFS.filter(p=>p.emp_id&&E(p.emp_id)),ids=links.map(p=>p.id);if(!ids.length)return;
const rows=[];links.forEach(p=>{const e=E(p.emp_id),i=payInfo(e);i.wk.forEach(w=>rows.push({user_id:p.id,week_start:w.ws,days:w.days,amount:w.amt,pay_date:w.pay,status:w.paid?'paid':(w.ws<=addD(i.np,-11)?'due':'held')}))});
await sb.from('pay_lines').delete().in('user_id',ids);if(rows.length){const{error}=await sb.from('pay_lines').insert(rows);if(error)throw error}}catch(e){console.error('syncPay',e)}}
// ---- reminders (owner)
function reminders(){const r=[],t=today();
S.rem.filter(x=>x.date<=t).forEach(x=>r.push({t:'🔔 '+x.text,id:x.id}));
const pr=payRun();if(pr.overdue>0)r.push({t:`💷 Pay overdue: ${gbp(pr.overdue)} – see Pay tab`});else if(pr.dueAmt>0&&(pr.np===t||addD(pr.np,-1)===t))r.push({t:`💷 Pay run ${pr.np===t?'today':'tomorrow'}: ${gbp(pr.dueAmt)} to ${pr.n} people`});
const pend=PROFS.filter(p=>p.role==='operative'&&!p.approved).length;if(pend)r.push({t:`🆕 ${pend} new login(s) to approve (Team tab)`});
const ap=OPS.checks.filter(c=>c.out_at&&!c.approved&&!c.rejected).length;if(ap)r.push({t:`📍 ${ap} check-in(s) to approve (Tasks tab)`});
S.emps.filter(e=>!e.rate&&e.active!==false).forEach(e=>r.push({t:`❓ ${e.name} has no day rate`}));
S.emps.filter(e=>!e.start&&e.active!==false).forEach(e=>r.push({t:`📅 ${e.name} has no start date`}));
S.jobs.filter(j=>j.status==='new').forEach(j=>r.push({t:`🆕 "${j.name}" is a new job – needs quote/details`}));
S.jobs.filter(j=>j.status==='complete'&&j.quote>jobFin(j).i).forEach(j=>r.push({t:`💰 ${j.name} complete – ${gbp(j.quote-jobFin(j).i)} still to collect`}));
S.quotes.filter(q=>q.status==='sent'&&q.sent<=iso(Date.now()-3*864e5)).forEach(q=>r.push({t:`📨 Quote ${q.ref} (${q.client}) sent 3+ days ago – chase?`}));
S.emps.forEach(e=>[['cscsx','CSCS card'],['ins','Insurance']].forEach(([k,l])=>{if(e[k]&&e[k]<=iso(Date.now()+30*864e5))r.push({t:`⚠️ ${e.name}: ${l} ${e[k]<today()?'expired':'expires'} ${e[k]}`})}));return r}
// ---- sign in / loading
async function boot(){if(!sb||!CFG.SUPABASE_URL||/YOUR-/.test(CFG.SUPABASE_URL)){mode='setup';return render()}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){mode='recover';render()}});
const{data:{session}}=await sb.auth.getSession();if(!session){mode='auth';return render()}await enter(session.user)}
async function enter(user){stat('Loading…');
try{const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('This login has no profile. Ask your boss.');ME=data;
if(ME.role==='owner'){await loadOwner();mode='owner';tab='today'}else if(ME.approved){await loadOp();mode='operative';tab='mytasks'}else mode='pending';stat('')}
catch(e){stat('⚠️ '+(e.message||e));mode='auth'}render()}
async function loadOwner(){const r=await sb.from('biz_state').select('data').eq('id',1).maybeSingle();cloudOK=!r.error;if(r.error)stat('⚠️ '+r.error.message);
if(r.data&&r.data.data&&Object.keys(r.data.data).length)S={...S,...r.data.data};else if(!r.error){try{const l=JSON.parse(localStorage.getItem('biz')||'null');if(l)S={...S,...l}}catch(e){}}
ensureS();await loadOps()}
async function loadOps(){const[a,b,c,d]=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('tasks').select('*').order('created_at',{ascending:false}).limit(200),sb.from('checkins').select('*').order('in_at',{ascending:false}).limit(150),sb.from('app_settings').select('*').eq('key','join_code').maybeSingle()]);
PROFS=a.data||[];OPS={tasks:b.data||[],checks:c.data||[]};JOINC=(d.data&&d.data.value)||''}
async function loadOp(){const[t,c,p,o]=await Promise.all([sb.from('tasks').select('*').order('created_at',{ascending:false}).limit(100),sb.from('checkins').select('*').order('in_at',{ascending:false}).limit(30),sb.from('pay_lines').select('*').order('week_start',{ascending:false}).limit(60),sb.from('onboarding').select('*').maybeSingle()]);
OPS={tasks:t.data||[],checks:c.data||[]};PAYL=p.data||[];MYDET=o.data||null}
async function signOut(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('biz')}catch(e){}S={emps:[],jobs:[],days:[],costs:[],inc:[],notes:[],rem:[],sor:[],quotes:[],paid:[],biz:{name:'',phone:'',vat:0},qn:0};ME=null;PROFS=[];OPS={tasks:[],checks:[]};PAYL=[];MYDET=null;FM=null;mode='auth';authTab='in';stat('');render()}
async function doAuth(){const e=$('#a_e').value.trim(),p=$('#a_p').value,m=$('#a_m');m.className='err';m.textContent='';
try{if(authTab==='up'){const n=$('#a_n').value.trim();if(!n)throw new Error('Enter your name');if(p.length<8)throw new Error('Password needs 8 or more characters');
const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n,join_code:$('#a_c').value.trim()}}});if(error)throw error;
if(!data.session){m.className='mu';m.textContent='Check your email and tap the confirmation link, then sign in.';return}await enter(data.user)}
else{const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;await enter(data.user)}}
catch(x){let t=x.message||String(x);if(/Database error/i.test(t))t='That join code is not right, or sign-ups are closed.';m.className='err';m.textContent=t}}
async function resetPw(){const e=$('#a_e').value.trim(),m=$('#a_m');if(!e){m.className='err';m.textContent='Type your email first';return}const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});m.className=error?'err':'mu';m.textContent=error?error.message:'Check your email for a reset link.'}
async function newPw(){const p=$('#a_p').value,m=$('#a_m');if(p.length<8){m.textContent='8 or more characters';return}const{data,error}=await sb.auth.updateUser({password:p});if(error){m.textContent=error.message;return}await enter(data.user)}
// ---- GPS
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('This browser has no location support.'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(new Error(e.code===1?'Location is blocked. Allow location for this site in your phone settings, then try again.':e.code===3?'Could not get a GPS fix. Go outside or near a window and try again.':'Could not get your location.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
async function geoHere(){try{const p=await getPos();$('#f_lat').value=p.lat.toFixed(6);$('#f_lng').value=p.lng.toFixed(6);if(!$('#f_radius').value)$('#f_radius').value=150;$('#ferr').textContent=''}catch(e){$('#ferr').textContent=e.message}}
async function geoFind(){const a=($('#f_address').value||'').trim();if(!a){$('#ferr').textContent='Enter the address first';return}try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q='+encodeURIComponent(a)),j=await r.json();if(!j[0])throw 0;$('#f_lat').value=(+j[0].lat).toFixed(6);$('#f_lng').value=(+j[0].lon).toFixed(6);if(!$('#f_radius').value)$('#f_radius').value=150;$('#ferr').textContent='Found – check it looks right on a map'}catch(e){$('#ferr').textContent='Could not find that address. Use the 📍 button while standing on site.'}}
const mapLink=t=>t.lat!=null&&t.lng!=null?`https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}`:t.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.address)}`:'';
const distTag=(m,r)=>m==null?'<span class="tag">no site location</span>':`<span class="tag ${m>(r||150)?'bad':'ok'}">${m>(r||150)?'⚠ ':'✓ '}${m>=1000?(m/1000).toFixed(1)+' km':m+' m'} from site</span>`;
// ---- operative actions
const om=t=>{const e=$('#om');if(e)e.textContent=t};
async function doIn(id){try{om('Getting your location…');const p=await getPos(),{error}=await sb.rpc('check_in',{p_task:id,p_lat:p.lat,p_lng:p.lng,p_acc:p.acc});if(error)throw error;await loadOp();render()}catch(e){om(e.message||String(e))}}
async function doOut(){try{om('Getting your location…');const p=await getPos(),{error}=await sb.rpc('check_out',{p_lat:p.lat,p_lng:p.lng,p_acc:p.acc});if(error)throw error;await loadOp();render()}catch(e){om(e.message||String(e))}}
async function setTask(id,st){try{const note=st==='done'&&$('#tn_'+id)?$('#tn_'+id).value.trim():'';const{error}=await sb.rpc('set_task_status',{p_id:id,p_status:st,p_note:note});if(error)throw error;await loadOp();render()}catch(e){om(e.message||String(e))}}
// ---- owner: tasks, approvals, logins
async function delTask(id){await sb.from('tasks').delete().eq('id',id);await loadOps();render()}
async function apCheck(id,frac){const c=OPS.checks.find(x=>x.id===id);if(!c)return;const p=PROFS.find(x=>x.id===c.user_id),e=p&&E(p.emp_id),jb=c.job_id&&J(c.job_id);

v.innerHTML=(FIT?`<div class="card"><div class="row"><b>Best fit – ${esc(FIT.job)}</b><a onclick="FIT=null;render()">✕</a></div>${FIT.msg?`<p class="mu">${esc(FIT.msg)}</p>`:FIT.list.map(x=>`<p><b>${esc(x.e.name)}</b> <span class="mu">${esc(x.e.trade)}</span><br><span class="mu">Matches: ${esc(x.hit.join(', ')||'none')}${x.miss.length?' · Missing: '+esc(x.miss.join(', ')):''}${x.busy?' · already on another job today':''}</span></p>`).join('')}</div>`:'')+`<div class="row"><h3>Jobs</h3><button onclick="jobForm()">+ Add job</button></div>`+(S.jobs.length?S.jobs.slice().reverse().map(j=>{const f=jobFin(j),n=S.notes.filter(x=>x.job===j.id).reverse(),geo=j.lat!==''&&j.lat!=null;return`<div class="card"><div class="row"><b>${esc(j.name)}</b><span class="tag">${j.status}</span></div><div class="mu">${esc([j.client,j.address].filter(Boolean).join(' · '))}</div><div class="mu">${geo?'📍 site location set':'<span class="bad">No site location – GPS check-in cannot be checked (Edit job)</span>'}</div><table><tr><td>Quote</td><td>${gbp(j.quote)}</td></tr><tr><td>Wages</td><td>${gbp(f.w)}</td></tr><tr><td>Other costs</td><td>${gbp(f.c)}</td></tr><tr><td>Received</td><td>${gbp(f.i)}</td></tr><tr><td><b>Profit so far</b></td><td class="${f.profit<0?'bad':'ok'}"><b>${gbp(f.profit)}</b></td></tr></table>${j.needs&&j.needs.length?`<div class="mu">Needs: ${esc(j.needs.join(', '))}</div>`:''}<div class="bar"><button class="g s" onclick="jobForm('${j.id}')">✎ Edit</button><button class="g s" onclick="moneyForm('costs','','${j.id}')">+ Cost</button><button class="g s" onclick="moneyForm('inc','','${j.id}')">+ Payment</button><button class="g s" onclick="noteForm('${j.id}')">+ Note</button><button class="g s" onclick="fit('${j.id}')">🧰 Best fit</button></div>${n.length?`<details><summary>${n.length} note(s)</summary>${n.map(x=>`<p class="mu">${x.date}: ${esc(x.text)} <a onclick="delNote('${x.id}')">✕</a></p>`).join('')}</details>`:''}</div>`}).join(''):'<div class="card mu">No jobs yet. Tap + Add job.</div>')}
function tasksView(){const v=$('#view'),nm=id=>{const p=PROFS.find(x=>x.id===id);return esc((p&&E(p.emp_id)&&E(p.emp_id).name)||(p&&p.full_name)||'?')},
now=OPS.checks.filter(c=>!c.out_at),rev=OPS.checks.filter(c=>c.out_at&&!c.approved&&!c.rejected),tk=OPS.tasks.filter(t=>t.status!=='done'),dn=OPS.tasks.filter(t=>t.status==='done').slice(0,8),
rad=c=>{const t=OPS.tasks.find(x=>x.id===c.task_id);return t?t.radius_m:150},hrs=c=>((new Date(c.out_at)-new Date(c.in_at))/36e5).toFixed(1);
v.innerHTML=`<div class="row"><h3>Tasks & attendance</h3><button onclick="taskForm()">+ Allocate task</button></div>
<div class="card"><h3>📍 On site now</h3>${now.length?now.map(c=>`<div class="row"><span>${nm(c.user_id)}<br><span class="mu">${esc(c.job_name)} · since ${ftm(c.in_at)}</span></span><span>${distTag(c.in_dist_m,rad(c))}</span></div>`).join('<hr>'):'<span class="mu">Nobody checked in</span>'}</div>
<div class="card"><h3>To approve (${rev.length})</h3>${rev.length?rev.map(c=>`<div style="margin-bottom:10px"><b>${nm(c.user_id)}</b> · ${esc(c.job_name)}<div class="mu">${fdt(c.in_at)} → ${ftm(c.out_at)} (${hrs(c)} h)</div><div class="mu">Arrived ${distTag(c.in_dist_m,rad(c))} Left ${distTag(c.out_dist_m,rad(c))}</div><div class="bar"><button class="s" onclick="apCheck('${c.id}',1)">✓ Full day</button><button class="g s" onclick="apCheck('${c.id}',0.5)">½ day</button><button class="g s" onclick="apCheck('${c.id}',0)">✕ Reject</button></div></div>`).join(''):'<span class="mu">Nothing waiting. Approved check-ins become days on site and feed wages.</span>'}</div>
<div class="card"><h3>Open tasks (${tk.length})</h3>${tk.length?tk.map(t=>`<div class="row" style="margin-bottom:8px"><span><b>${esc(t.title)}</b> <span class="tag">${t.status}</span><br><span class="mu">${nm(t.user_id)} · ${esc(t.job_name||'no job')}${t.due_date?' · '+fdate(t.due_date):''}</span>${t.notes?`<br><span class="mu">📝 ${esc(t.notes)}</span>`:''}</span><a onclick="delTask('${t.id}')">✕</a></div>`).join(''):'<span class="mu">No open tasks</span>'}</div>
${dn.length?`<div class="card"><h3>Recently done</h3>${dn.map(t=>`<div class="mu">✓ ${esc(t.title)} · ${nm(t.user_id)}${t.notes?' – '+esc(t.notes):''}</div>`).join('')}</div>`:''}`}
function payView(){const v=$('#view'),pr=payRun(),hist=S.paid.slice().sort((a,b)=>b.on<a.on?-1:b.on>a.on?1:0).slice(0,15);
v.innerHTML=`<div class="card"><div class="mu">Next pay run</div><div class="big">${fdate(pr.np)}</div><table><tr><td>Paid out on that run</td><td>${gbp(pr.dueAmt)}</td></tr><tr><td>Stays in hand after that run</td><td>${gbp(pr.heldAmt)}</td></tr><tr><td><b>Held right now (earned, not paid)</b></td><td><b>${gbp(pr.dueAmt+pr.heldAmt)}</b></td></tr></table><p class="mu">Work Monday to Friday is paid on the Friday of the following week. Someone who starts mid-week is paid for those days on that same Friday.</p></div>`+
(S.emps.length?S.emps.map(e=>{const i=payInfo(e);if(e.active===false&&!i.up.length)return'';return`<div class="card"><div class="row"><b>${esc(e.name)}${e.active===false?' <span class="tag">left</span>':''}</b><span class="mu">${gbp(e.rate)}/day</span></div><table><tr><td>Start date</td><td>${i.startDt?fdate(i.startDt):'<a onclick="empForm(\''+e.id+'\')">⚠ add start date</a>'}</td></tr><tr><td>First pay date</td><td>${fdate(i.firstPay)}</td></tr><tr><td>Paid on ${fdate(i.np)}</td><td>${gbp(i.dueAmt)}</td></tr><tr><td>Held after that</td><td>${gbp(i.heldAmt)}</td></tr></table>${i.up.length?`<details><summary>${i.up.length} unpaid week(s)</summary><table>${i.up.map(w=>`<tr><td>w/c ${fdate(w.ws)} · ${w.days} day${w.days===1?'':'s'}<br><span class="mu">pays ${fdate(w.pay)}${w.pay<today()?' · overdue':''}</span></td><td>${gbp(w.amt)}</td></tr>`).join('')}</table></details>`:''}<div class="bar">${i.dueAmt>0?`<button class="s" onclick="markPaid('${e.id}',false)">✓ Mark ${gbp(i.dueAmt)} paid</button>`:''}${i.up.length&&(e.active===false||i.heldAmt>0)?`<button class="g s" onclick="markPaid('${e.id}',true)">Pay everything${e.active===false?' (leaver)':''}</button>`:''}</div></div>`}).join(''):'<div class="card mu">Add workers first.</div>')+
(hist.length?`<div class="card"><h3>Paid (latest, tap ✕ to undo)</h3><table>${hist.map(p=>`<tr><td>${fdate(p.on)} · ${esc((E(p.emp)||{}).name||'?')}<br><span class="mu">week of ${fdate(p.ws)}</span></td><td>${gbp(p.amt)} <a onclick="unPay('${p.id}')">✕</a></td></tr>`).join('')}</table></div>`:'')}
function moneyView(){const v=$('#view'),t=totals(),pr=payRun();
v.innerHTML=`<div class="card" onclick="tab='pay';render()"><div class="mu">Held from the team right now (earned, unpaid)</div><div class="big">${gbp(pr.dueAmt+pr.heldAmt)}</div><div class="mu">Next run ${fdate(pr.np)}: ${gbp(pr.dueAmt)} · stays in hand: ${gbp(pr.heldAmt)} · tap for Pay</div></div>
<div class="card"><table><tr><td>Cost of work this week (wages + costs)</td><td>${gbp(t.out)}</td></tr><tr><td>Total received</td><td>${gbp(t.income)}</td></tr><tr><td><b>Company profit (all time)</b></td><td class="${t.profit<0?'bad':'ok'}"><b>${gbp(t.profit)}</b></td></tr></table></div>
<div class="bar"><button onclick="moneyForm('costs')">+ Cost</button><button onclick="moneyForm('inc')">+ Payment in</button></div>${moneyList()}<button id="xl" style="width:100%">📊 Download spreadsheet</button><p class="mu" id="xs"></p><div class="bar"><button class="g" onclick="backup()">💾 Backup</button><button class="g" onclick="$('#rf').click()">♻️ Restore</button><input type="file" id="rf" accept=".json" hidden onchange="restore(this)"></div>`;
$('#xl').onclick=async()=>{try{await exportXlsx();$('#xs').textContent='Spreadsheet ready.'}catch(e){$('#xs').textContent='Could not save: '+(e.message||e.code)}}}
// ---- operative views
function myTasksView(){const v=$('#view'),open=OPS.checks.find(c=>!c.out_at),tk=OPS.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due_date||'9')<(b.due_date||'9')?-1:1),dn=OPS.tasks.filter(t=>t.status==='done').slice(0,5),hist=OPS.checks.filter(c=>c.out_at).slice(0,7);
v.innerHTML=(open?`<div class="card"><b>📍 You are on site: ${esc(open.job_name||'job')}</b><div class="mu">Since ${fdt(open.in_at)}</div><div style="margin:6px 0">${distTag(open.in_dist_m,150)}</div><button onclick="doOut()">Check out – I'm leaving</button></div>`:'')+`<p class="mu" id="om"></p>`+
(tk.length?tk.map(t=>{const ml=mapLink(t),here=open&&open.task_id===t.id;return`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="tag">${t.status==='doing'?'in progress':'to do'}</span></div><div class="mu">${esc(t.job_name||'')}${t.address?' · '+esc(t.address):''}</div>${t.due_date?`<div class="mu">For ${fdate(t.due_date)}</div>`:''}${t.details?`<p style="white-space:pre-wrap">${esc(t.details)}</p>`:''}${ml?`<a href="${ml}" target="_blank" rel="noopener">🗺 Open in Maps</a>`:''}<textarea id="tn_${t.id}" rows="1" placeholder="Note for your boss (optional)" style="margin-top:8px"></textarea><div class="bar">${!open&&t.job_name?`<button class="s" onclick="doIn('${t.id}')">📍 Check in</button>`:''}${t.status==='todo'?`<button class="g s" onclick="setTask('${t.id}','doing')">Start</button>`:''}${here?'':`<button class="g s" onclick="setTask('${t.id}','done')">✓ Done</button>`}</div></div>`}).join(''):'<div class="card mu">No tasks right now. Your boss will send you jobs here.</div>')+
`<p class="mu">Your location is recorded only at the moment you tap Check in or Check out. It is not tracked in between.</p>`+
(hist.length?`<div class="card"><h3>My recent days</h3><table>${hist.map(c=>`<tr><td>${fdt(c.in_at)} → ${ftm(c.out_at)}<br><span class="mu">${esc(c.job_name)}</span></td><td>${c.rejected?'<span class="bad">not counted</span>':c.approved?'<span class="ok">✓ '+(c.frac<1?'½':'1')+' day</span>':'<span class="mu">waiting</span>'}</td></tr>`).join('')}</table></div>`:'')+
(dn.length?`<details><summary>Done tasks</summary>${dn.map(t=>`<p class="mu">✓ ${esc(t.title)} · ${esc(t.job_name||'')}</p>`).join('')}</details>`:'')}
function myPayView(){const v=$('#view'),up=PAYL.filter(r=>r.status!=='paid'),pd=PAYL.filter(r=>r.status==='paid'),s=a=>a.reduce((x,r)=>x+Number(r.amount),0),nxt=up.filter(r=>r.status==='due').map(r=>r.pay_date).sort()[0];
v.innerHTML=`<div class="card"><div class="mu">Earned, not yet paid</div><div class="big">${gbp(s(up))}</div>${nxt?`<div class="mu">Next payment: ${fdate(nxt)}</div>`:''}<p class="mu">You are paid on the Friday after the week you work. The latest week stays in hand until the following Friday.</p></div>`+
(PAYL.length?`<div class="card"><table>${PAYL.map(r=>`<tr><td>w/c ${fdate(r.week_start)} · ${Number(r.days)} day${Number(r.days)===1?'':'s'}<br><span class="mu">${r.status==='paid'?'paid':'pays '+fdate(r.pay_date)}</span></td><td>${gbp(r.amount)}<br><span class="tag">${r.status==='paid'?'paid':r.status==='due'?'next run':'in hand'}</span></td></tr>`).join('')}</table></div>`:'<div class="card mu">Nothing yet. Days appear here once your boss approves them.</div>')+(pd.length?`<p class="mu">Paid so far: ${gbp(s(pd))}</p>`:'')}
function detailsView(){const sv=(MYDET&&MYDET.data)||{};let h='<h3>My details</h3><p class="mu">Your boss uses these for your pay and for emergencies. Only you and your boss can see them.</p>',open=false;
for(const f of JF){if(f==='chips'){h+='<label>Tap everything you can do</label><div class="chips">'+SKL.map(k=>{const on=(sv.skills||[]).includes(k);return`<label class="${on?'on':''}"><input type="checkbox" value="${k}"${on?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${k}</label>`}).join('')+'</div>';continue}
if(f.length===1){h+=(open?'</div>':'')+`<div class="card"><h3>${f[0]}</h3>`;open=true;continue}
const[id,l,t]=f,x=sv[id]??'';h+=`<label>${l}</label>`+(t==='area'?`<textarea id="j_${id}" rows="2">${esc(x)}</textarea>`:t&&t.startsWith('sel:')?`<select id="j_${id}">${t.slice(4).split(',').map(o=>`<option${o===x?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="j_${id}" type="${t||'text'}" value="${esc(x)}">`)}
$('#view').innerHTML=h+'</div><p class="err" id="jerr"></p><button onclick="detSave()">Save my details</button><p class="mu" id="jok"></p>'}
async function detSave(){const o={};for(const f of JF){if(f==='chips'||f.length===1)continue;o[f[0]]=$('#j_'+f[0]).value.trim()}
o.skills=[...document.querySelectorAll('#view .chips input:checked')].map(x=>x.value);
if(!o.name||!o.phone||!o.kn||!o.kp||!o.trade){$('#jerr').textContent='Please fill in everything marked *.';return}$('#jerr').textContent='';
const{error}=await sb.from('onboarding').upsert({user_id:ME.id,data:o,updated_at:new Date().toISOString()});if(error){$('#jerr').textContent=error.message;return}MYDET={data:o};$('#jok').textContent='Saved. Your boss can now see them.'}
// ---- main render
function render(){const inApp=mode==='owner'||mode==='operative',nav=$('#nav'),v=$('#view');
$('#top').style.display=(inApp||mode==='pending')?'flex':'none';$('#who').textContent=ME?(ME.full_name||ME.email):'';
const items=mode==='owner'?OWN:mode==='operative'?OPN:[];nav.style.display=items.length?'':'none';nav.innerHTML=items.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
$('#rems').innerHTML=mode==='owner'&&!FM?reminders().slice(0,3).map(r=>`<div class="rem"><span>${esc(r.t)}</span>${r.id?`<a data-d="${r.id}">✕</a>`:''}</div>`).join(''):'';
if(mode==='setup')return setupView();if(mode==='boot'){v.innerHTML='<div class="card mu">Loading…</div>';return}if(mode==='auth')return authView();if(mode==='recover')return recoverView();if(mode==='pending')return pendingView();
if(FM)return paintForm();
if(mode==='operative'){if(tab==='mypay')return myPayView();if(tab==='mydetails')return detailsView();return myTasksView()}
if(tab==='jobs')return jobsView();if(tab==='tasks')return tasksView();if(tab==='pay')return payView();if(tab==='quotes')return quotesView();if(tab==='money')return moneyView();return teamView()}
async function poll(){if(document.hidden||FM||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;try{if(mode==='owner'){await loadOps();if(tab==='tasks'||tab==='today')render()}else if(mode==='operative'){await loadOp();if(tab==='mytasks'||tab==='mypay')render()}else if(mode==='pending'&&ME){await enter({id:ME.id})}}catch(e){}}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t){FM=null;FIT=null;tab=b.dataset.t;render();$('#view').scrollTop=0}};
$('#rems').onclick=e=>{const id=e.target.dataset?.d;if(id){S.rem=S.rem.filter(r=>r.id!==id);save();render()}};
$('#so').onclick=signOut;
setInterval(poll,60000);
boot();
