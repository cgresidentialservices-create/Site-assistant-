<title>C&amp;G Site Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
/* C&G Site Assistant: navy and olive from the logo, serif numerals, tab bar with icons. */
:root{box-sizing:border-box;color-scheme:light dark;
--bg:#f3f4f9;--cd:#ffffff;--tx:#14183a;--mu:#6a7090;--bd:#e3e6f0;--tint:#eceffa;
--ac:#1b2150;--onac:#ffffff;--green:#527421;--ok:#2d7a43;--bad:#b4352a;
--shadow:0 1px 2px rgba(20,24,58,.05),0 8px 24px rgba(20,24,58,.05);
--display:'Source Serif 4',Georgia,'Times New Roman',serif;
--ui:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--gut:max(16px,calc((100vw - 720px)/2));
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0e20;--cd:#141937;--tx:#eceefb;--mu:#9aa1c7;--bd:#242a4d;--tint:#1c2247;
--ac:#aab5ff;--onac:#10143a;--green:#a5cf6a;--ok:#7fd29a;--bad:#ff8f84;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14.5px/1.5 var(--ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:16px var(--gut) 28px;-webkit-overflow-scrolling:touch}
#top{display:none;align-items:center;gap:10px;padding:9px var(--gut);background:var(--cd);background:color-mix(in srgb,var(--cd) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:relative;z-index:2}
#top .mark{height:30px;width:auto;background:#fff;border-radius:9px;padding:3px 5px;border:1px solid var(--bd)}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font:600 18px var(--display);letter-spacing:.2px}
.brand span{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600;white-space:nowrap}
#who{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mu)}
.hero{display:block;width:min(250px,68%);margin:20px auto 18px;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid2 .card{margin:0;padding:13px 12px}.grid2 .big{font-size:clamp(24px,6vw,34px);overflow-wrap:anywhere}@media(max-width:420px){.grid2{gap:7px}.grid2 .card{padding:11px 9px}}\n.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mu{color:var(--mu);font-size:12.5px}
.big{font:600 36px/1.1 var(--display);letter-spacing:-.5px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.err{color:var(--bad);font-size:13px}
h3{margin:2px 0 10px;font:600 19px/1.25 var(--display);letter-spacing:.1px}
.card>b:first-child,.card>.row>b{font-weight:600}
p{margin:8px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:9px 0;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child{text-align:right;white-space:nowrap}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
details{margin-top:8px}
summary{color:var(--mu);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--mu);vertical-align:middle}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
a,.card a{color:var(--ac);cursor:pointer;text-decoration:none;font-weight:600}
a[href]{text-decoration:underline;text-underline-offset:3px}
button{font:600 13.5px var(--ui);border:0;border-radius:12px;background:var(--ac);color:var(--onac);padding:11px 18px;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:10px 16px}
button.s{padding:7px 13px;font-size:12.5px;border-radius:10px}
button.g.s{padding:6px 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.card .bar{margin:12px 0 0}
input,select,textarea{width:100%;padding:12px 14px;margin:0 0 8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:400 16px var(--ui)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input.n{width:92px;margin:0;text-align:right;padding:7px 9px;font-size:15px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{margin:0;color:var(--tx);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;border:1px solid var(--bd);border-radius:99px;padding:7px 13px;background:var(--bg)}
.chips input{display:none}
.chips label.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.rem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tint);color:var(--tx);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:13px;font-weight:500}
.rem::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--green)}
.rem span{flex:1}.rem a{opacity:.6}
#warn,#rems{padding:0 var(--gut)}#warn:not(:empty),#rems:not(:empty){padding-top:10px}
nav{display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:4px var(--gut) 2px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--mu);border-radius:12px;padding:8px 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
nav button.on::before{content:"";position:absolute;top:-5px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--ac)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const wkStart=(d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const wkEnd=w=>{const x=new Date(w+'T12:00');x.setDate(x.getDate()+6);return iso(x)};
const gbp=n=>(n<0?'-':'')+'£'+Math.abs(Number(n||0)).toLocaleString('en-GB',{maximumFractionDigits:2});
const CFG=window.APP_CONFIG||{};let sb=null;try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){console.error(e)}
let FM=null,tab='today',mode='boot',ME=null,PROFS=[],OPS={tasks:[],checks:[]},PAYL=[],MYDET=null,JOINC='',FIT=null,authTab='in',cloudOK=false,dirty=false,saveT,stT;
let S={emps:[],jobs:[],days:[],costs:[],inc:[],notes:[],rem:[],sor:[],quotes:[],paid:[],biz:{name:'',phone:'',vat:0},qn:0};
const ensureS=()=>{['emps','jobs','days','costs','inc','notes','rem','sor','quotes','paid'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.biz)S.biz={name:'',phone:'',vat:0};S.qn=S.qn||0;delete S.chat};
const stat=t=>{$('#warn').innerHTML=t?'<div class="rem"><span>'+t+'</span></div>':'';clearTimeout(stT);if(t&&t[0]==='✓')stT=setTimeout(()=>stat(''),2000)};
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){clearTimeout(saveT);if(mode!=='owner'||!dirty)return;
if(!cloudOK){stat('Not saved – could not reach the database. Reload the page.');return}
try{localStorage.setItem('biz',JSON.stringify(S))}catch(e){}
try{const{error}=await sb.from('biz_state').upsert({id:1,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});if(error)throw error;dirty=false;stat('✓ Saved');syncPay()}catch(e){stat('Save failed: '+(e.message||e))}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
// downloads (works on normal hosting)
const DL={save:async({filename,data})=>{const b=new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'–';
const fdt=d=>new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ftm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

const E=id=>S.emps.find(e=>e.id===id),J=id=>S.jobs.find(j=>j.id===id);
const wage=d=>d.rate*d.frac;
const inWk=(d,w=wkStart())=>d.date>=w&&d.date<=wkEnd(w);
function owed(w=wkStart()){return S.emps.map(e=>{const ds=S.days.filter(d=>d.emp===e.id&&inWk(d,w));return{e,days:ds.reduce((a,d)=>a+d.frac,0),amt:ds.reduce((a,d)=>a+wage(d),0)}})}
function jobFin(j){const w=S.days.filter(d=>d.job===j.id).reduce((a,d)=>a+wage(d),0),c=S.costs.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0),i=S.inc.filter(x=>x.job===j.id).reduce((a,x)=>a+x.amt,0);return{w,c,i,profit:i-w-c}}
function totals(){const wk=wkStart(),wages=owed().reduce((a,o)=>a+o.amt,0),costs=S.costs.filter(c=>inWk(c,wk)).reduce((a,c)=>a+c.amt,0);
const aw=S.days.reduce((a,d)=>a+wage(d),0),ac=S.costs.reduce((a,c)=>a+c.amt,0),ai=S.inc.reduce((a,c)=>a+c.amt,0);return{wages,costs,out:wages+costs,profit:ai-aw-ac,income:ai}}
const findJ=n=>S.jobs.find(j=>[j.name,j.address,j.client].filter(Boolean).some(s=>{s=s.toLowerCase();n=(n||'').toLowerCase().trim();return n&&(s.includes(n)||n.includes(s))}));
// ---- pay: work Mon–Sun week, paid the Friday of the FOLLOWING week (week in hand)
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const wkOf=d=>wkStart(new Date(d+'T12:00'));
const payDateOf=ws=>addD(ws,11);
const nextPay=(from=today())=>{const x=new Date(from+'T12:00');x.setDate(x.getDate()+((5-x.getDay()+7)%7));return iso(x)};
const isPaid=(eid,ws)=>S.paid.some(p=>p.emp===eid&&p.ws===ws);
function weeksOf(eid){const m={};S.days.filter(d=>d.emp===eid).forEach(d=>{const ws=wkOf(d.date),w=m[ws]||(m[ws]={ws,days:0,amt:0});w.days+=d.frac;w.amt+=wage(d)});return Object.values(m).sort((a,b)=>a.ws<b.ws?-1:1)}
function payInfo(e,asOf=today()){const np=nextPay(asOf),nextWs=addD(np,-11);
const wk=weeksOf(e.id).map(w=>({...w,pay:payDateOf(w.ws),paid:isPaid(e.id,w.ws)})),up=wk.filter(w=>!w.paid),due=up.filter(w=>w.ws<=nextWs),held=up.filter(w=>w.ws>nextWs),sum=a=>a.reduce((x,w)=>x+w.amt,0);
const dts=S.days.filter(d=>d.emp===e.id).map(d=>d.date).sort(),startDt=e.start||dts[0]||'';
return{wk,up,due,held,dueAmt:sum(due),heldAmt:sum(held),np,startDt,firstPay:startDt?payDateOf(wkOf(startDt)):'',overdue:sum(up.filter(w=>w.pay<asOf))}}
function payRun(){const t=today();let dueAmt=0,heldAmt=0,overdue=0,n=0;S.emps.forEach(e=>{const i=payInfo(e);dueAmt+=i.dueAmt;heldAmt+=i.heldAmt;overdue+=i.overdue;if(i.dueAmt>0)n++});return{np:nextPay(t),dueAmt,heldAmt,overdue,n}}
const payRows=()=>S.emps.map(e=>{const i=payInfo(e);return{Name:e.name,Active:e.active!==false,'Start date':i.startDt,'First pay date':i.firstPay,'Next pay date':i.np,'Paid on next run':i.dueAmt,'Held after next run':i.heldAmt,'Total held now':i.dueAmt+i.heldAmt}});
const empCanPay=e=>S.emps.some(x=>x.id===e.id);
function markPaid(eid,all){const e=E(eid),i=payInfo(e);(all?i.up:i.due).forEach(w=>S.paid.push({id:uid(),emp:eid,ws:w.ws,amt:w.amt,on:today()}));save();render()}
function unPay(id){S.paid=S.paid.filter(p=>p.id!==id);save();render()}
async function syncPay(){if(mode!=='owner')return;try{const links=PROFS.filter(p=>p.emp_id&&E(p.emp_id)),ids=links.map(p=>p.id);if(!ids.length)return;
const rows=[];links.forEach(p=>{const e=E(p.emp_id),i=payInfo(e);i.wk.forEach(w=>rows.push({user_id:p.id,week_start:w.ws,days:w.days,amount:w.amt,pay_date:w.pay,status:w.paid?'paid':(w.ws<=addD(i.np,-11)?'due':'held')}))});
await sb.from('pay_lines').delete().in('user_id',ids);if(rows.length){const{error}=await sb.from('pay_lines').insert(rows);if(error)throw error}}catch(e){console.error('syncPay',e)}}
// ---- reminders (owner)
function reminders(){const r=[],t=today();
S.rem.filter(x=>x.date<=t).forEach(x=>r.push({t:''+x.text,id:x.id}));
const pr=payRun();if(pr.overdue>0)r.push({t:`Pay overdue: ${gbp(pr.overdue)} – see Pay tab`});else if(pr.dueAmt>0&&(pr.np===t||addD(pr.np,-1)===t))r.push({t:`Pay run ${pr.np===t?'today':'tomorrow'}: ${gbp(pr.dueAmt)} to ${pr.n} people`});
const pend=PROFS.filter(p=>p.role==='operative'&&!p.approved).length;if(pend)r.push({t:`${pend} new login(s) to approve (Team tab)`});
const ap=OPS.checks.filter(c=>c.out_at&&!c.approved&&!c.rejected).length;if(ap)r.push({t:`${ap} check-in(s) to approve (Tasks tab)`});
S.emps.filter(e=>!e.rate&&e.active!==false).forEach(e=>r.push({t:`❓ ${e.name} has no day rate`}));
S.emps.filter(e=>!e.start&&e.active!==false).forEach(e=>r.push({t:`${e.name} has no start date`}));
S.jobs.filter(j=>j.status==='new').forEach(j=>r.push({t:`"${j.name}" is a new job – needs quote/details`}));
S.jobs.filter(j=>j.status==='complete'&&j.quote>jobFin(j).i).forEach(j=>r.push({t:`${j.name} complete – ${gbp(j.quote-jobFin(j).i)} still to collect`}));
S.quotes.filter(q=>q.status==='sent'&&q.sent<=iso(Date.now()-3*864e5)).forEach(q=>r.push({t:`Quote ${q.ref} (${q.client}) sent 3+ days ago – chase?`}));
S.emps.forEach(e=>[['cscsx','CSCS card'],['ins','Insurance']].forEach(([k,l])=>{if(e[k]&&e[k]<=iso(Date.now()+30*864e5))r.push({t:`${e.name}: ${l} ${e[k]<today()?'expired':'expires'} ${e[k]}`})}));return r}
// ---- sign in / loading
async function boot(){if(!sb||!CFG.SUPABASE_URL||/YOUR-/.test(CFG.SUPABASE_URL)){mode='setup';return render()}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){mode='recover';render()}});
const{data:{session}}=await sb.auth.getSession();if(!session){mode='auth';return render()}await enter(session.user)}
async function enter(user){stat('Loading…');
try{const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('This login has no profile. Ask your boss.');ME=data;
if(ME.role==='owner'){await loadOwner();mode='owner';tab='home'}else{await loadOp();if(!onboardingComplete(MYDET&&MYDET.data)){mode='onboarding';tab='onboarding'}else if(ME.approved){mode='operative';tab='mytasks'}else mode='pending'}stat('')}
catch(e){stat(''+(e.message||e));mode='auth'}render()}
async function loadOwner(){const r=await sb.from('biz_state').select('data').eq('id',1).maybeSingle();cloudOK=!r.error;if(r.error)stat(''+r.error.message);
if(r.data&&r.data.data&&Object.keys(r.data.data).length)S={...S,...r.data.data};else if(!r.error){try{const l=JSON.parse(localStorage.getItem('biz')||'null');if(l)S={...S,...l}}catch(e){}}
ensureS();if(!S.sor.length)seedStarterRates();await loadOps()}
async function loadOps(){const[a,b,c,d]=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('tasks').select('*').order('created_at',{ascending:false}).limit(200),sb.from('checkins').select('*').order('in_at',{ascending:false}).limit(150),sb.from('app_settings').select('*').eq('key','join_code').maybeSingle()]);
PROFS=a.data||[];OPS={tasks:b.data||[],checks:c.data||[]};JOINC=(d.data&&d.data.value)||''}
async function loadOp(){const[t,c,p,o]=await Promise.all([sb.from('tasks').select('*').order('created_at',{ascending:false}).limit(100),sb.from('checkins').select('*').order('in_at',{ascending:false}).limit(30),sb.from('pay_lines').select('*').order('week_start',{ascending:false}).limit(60),sb.from('onboarding').select('*').eq('user_id',ME.id).maybeSingle()]);
OPS={tasks:t.data||[],checks:c.data||[]};PAYL=p.data||[];MYDET=o.data||null}
async function signOut(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('biz')}catch(e){}S={emps:[],jobs:[],days:[],costs:[],inc:[],notes:[],rem:[],sor:[],quotes:[],paid:[],biz:{name:'',phone:'',vat:0},qn:0};ME=null;PROFS=[];OPS={tasks:[],checks:[]};PAYL=[];MYDET=null;FM=null;mode='auth';authTab='in';stat('');render()}
async function doAuth(){const e=$('#a_e').value.trim(),p=$('#a_p').value,m=$('#a_m');m.className='err';m.textContent='';
try{if(authTab==='up'){const n=$('#a_n').value.trim();if(!n)throw new Error('Enter your name');if(p.length<8)throw new Error('Password needs 8 or more characters');
const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n,join_code:$('#a_c').value.trim()}}});if(error)throw error;
if(!data.session){m.className='mu';m.textContent='Check your email and tap the confirmation link, then sign in.';return}await enter(data.user)}
else{const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;await enter(data.user)}}
catch(x){let t=x.message||String(x);if(/Database error/i.test(t))t='That join code is not right, or sign-ups are closed.';m.className='err';m.textContent=t}}
async function resetPw(){const e=$('#a_e').value.trim(),m=$('#a_m');if(!e){m.className='err';m.textContent='Type your email first';return}const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});m.className=error?'err':'mu';m.textContent=error?error.message:'Check your email for a reset link.'}
async function newPw(){const p=$('#a_p').value,m=$('#a_m');if(p.length<8){m.textContent='8 or more characters';return}const{data,error}=await sb.auth.updateUser({password:p});if(error){m.textContent=error.message;return}await enter(data.user)}
// ---- GPS
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('This browser has no location support.'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(new Error(e.code===1?'Location is blocked. Allow location for this site in your phone settings, then try again.':e.code===3?'Could not get a GPS fix. Go outside or near a window and try again.':'Could not get your location.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
async function geoHere(){try{const p=await getPos();$('#f_lat').value=p.lat.toFixed(6);$('#f_lng').value=p.lng.toFixed(6);if(!$('#f_radius').value)$('#f_radius').value=150;$('#ferr').textContent=''}catch(e){$('#ferr').textContent=e.message}}

(tk.length?tk.map(t=>{const ml=mapLink(t),here=open&&open.task_id===t.id;return`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="tag">${t.status==='doing'?'in progress':'to do'}</span></div><div class="mu">${esc(t.job_name||'')}${t.address?' · '+esc(t.address):''}</div>${t.due_date?`<div class="mu">For ${fdate(t.due_date)}</div>`:''}${t.details?`<p style="white-space:pre-wrap">${esc(t.details)}</p>`:''}${ml?`<a href="${ml}" target="_blank" rel="noopener">Open in Maps</a>`:''}<textarea id="tn_${t.id}" rows="1" placeholder="Note for your boss (optional)" style="margin-top:8px"></textarea><div class="bar">${!open&&t.job_name?`<button class="s" onclick="doIn('${t.id}')">Check in</button>`:''}${t.status==='todo'?`<button class="g s" onclick="setTask('${t.id}','doing')">Start</button>`:''}${here?'':`<button class="g s" onclick="setTask('${t.id}','done')">✓ Done</button>`}</div></div>`}).join(''):'<div class="card mu">No tasks right now. Your boss will send you jobs here.</div>')+
`<p class="mu">Your location is recorded only at the moment you tap Check in or Check out. It is not tracked in between.</p>`+
(hist.length?`<div class="card"><h3>My recent days</h3><table>${hist.map(c=>`<tr><td>${fdt(c.in_at)} → ${ftm(c.out_at)}<br><span class="mu">${esc(c.job_name)}</span></td><td>${c.rejected?'<span class="bad">not counted</span>':c.approved?'<span class="ok">✓ '+(c.frac<1?'½':'1')+' day</span>':'<span class="mu">waiting</span>'}</td></tr>`).join('')}</table></div>`:'')+
(dn.length?`<details><summary>Done tasks</summary>${dn.map(t=>`<p class="mu">✓ ${esc(t.title)} · ${esc(t.job_name||'')}</p>`).join('')}</details>`:'')}
function myPayView(){const v=$('#view'),up=PAYL.filter(r=>r.status!=='paid'),pd=PAYL.filter(r=>r.status==='paid'),s=a=>a.reduce((x,r)=>x+Number(r.amount),0),nxt=up.filter(r=>r.status==='due').map(r=>r.pay_date).sort()[0];
v.innerHTML=`<div class="card"><div class="mu">Earned, not yet paid</div><div class="big">${gbp(s(up))}</div>${nxt?`<div class="mu">Next payment: ${fdate(nxt)}</div>`:''}<p class="mu">You are paid on the Friday after the week you work. The latest week stays in hand until the following Friday.</p></div>`+
(PAYL.length?`<div class="card"><table>${PAYL.map(r=>`<tr><td>w/c ${fdate(r.week_start)} · ${Number(r.days)} day${Number(r.days)===1?'':'s'}<br><span class="mu">${r.status==='paid'?'paid':'pays '+fdate(r.pay_date)}</span></td><td>${gbp(r.amount)}<br><span class="tag">${r.status==='paid'?'paid':r.status==='due'?'next run':'in hand'}</span></td></tr>`).join('')}</table></div>`:'<div class="card mu">Nothing yet. Days appear here once your boss approves them.</div>')+(pd.length?`<p class="mu">Paid so far: ${gbp(s(pd))}</p>`:'')}

function onboardingComplete(o){return !!(o&&o.name&&o.phone&&o.email&&o.addr&&o.dob&&o.ni&&o.rtw&&o.kn&&o.kr&&o.kp&&o.trade&&o.consent==='yes')}
function onboardingView(){
  detailsView();
  const v=$('#view');
  v.insertAdjacentHTML('afterbegin',`<div class="card"><h2>Complete your staff file before continuing</h2><p class="mu">Please complete every required field and confirm how your personal information and documents will be used. You cannot access the staff home page until this is saved.</p></div>`);
  v.insertAdjacentHTML('beforeend',`<div class="card"><h3>Staff documents</h3><p class="mu">Upload clear photos or PDFs of right-to-work evidence and relevant certificates/cards. Documents are stored in a private staff file. Only you and authorised C&amp;G administrators can access them.</p>
  <label>Document type</label><select id="doc_type"><option value="right_to_work">Right-to-work evidence</option><option value="photo_id">Photo ID</option><option value="qualification">Qualification / trade certificate</option><option value="cscs">CSCS card</option><option value="other">Other work document</option></select>
  <label>Choose document (PDF, JPG, PNG or WEBP; max 10 MB)</label><input id="doc_file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
  <button class="g" onclick="uploadStaffDoc()">Upload to my staff file</button><p class="err" id="doc_err"></p><div id="my_docs"></div></div>
  <div class="card"><label style="display:flex;gap:10px;align-items:flex-start"><input id="j_consent" type="checkbox" ${((MYDET&&MYDET.data&&MYDET.data.consent)==='yes')?'checked':''} style="width:auto;margin-top:4px"> I confirm the information is accurate and understand C&amp;G Residential Services will use it for staff administration, pay, emergency contact and right-to-work / qualification checks. Access is restricted to authorised personnel. Where legally required, relevant evidence may be disclosed to the appropriate authorities. I have read this explanation.</label><p class="mu">A secure viewer can discourage downloading, but cannot prevent screenshots or copying. Right-to-work evidence may need to be retained to comply with UK requirements.</p></div>
  <button onclick="saveOnboardingAndContinue()">Save staff file &amp; continue</button><p class="err" id="onb_err"></p>`);
  loadMyDocs();
}
async function uploadStaffDoc(){
 const f=$('#doc_file').files[0],err=$('#doc_err');err.textContent='';
 if(!f){err.textContent='Choose a file first.';return}
 if(f.size>10*1024*1024){err.textContent='File must be 10 MB or smaller.';return}
 const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
 if(!allowed.includes(f.type)){err.textContent='Use a PDF, JPG, PNG or WEBP file.';return}
 const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-100),path=ME.id+'/'+Date.now()+'_'+safe;
 const {error:upErr}=await sb.storage.from('staff-documents').upload(path,f,{contentType:f.type,upsert:false});
 if(upErr){err.textContent='Upload failed: '+upErr.message+'. Check the Supabase staff-documents bucket and policies have been set up.';return}
 const {error:dbErr}=await sb.from('staff_documents').insert({user_id:ME.id,storage_path:path,document_type:$('#doc_type').value,file_name:safe,mime_type:f.type});
 if(dbErr){err.textContent='File uploaded but its record could not be saved: '+dbErr.message+'. Ask the administrator to check the SQL setup.';return}
 $('#doc_file').value='';err.textContent='Uploaded securely.';loadMyDocs();
}
async function loadMyDocs(){
 const box=$('#my_docs');if(!box||!ME)return;box.innerHTML='<p class="mu">Loading documents…</p>';
 const {data,error}=await sb.from('staff_documents').select('id,document_type,file_name,created_at,storage_path,mime_type').eq('user_id',ME.id).order('created_at',{ascending:false});
 if(!document.getElementById('my_docs'))return;
 if(error){box.innerHTML='<p class="mu">Document list unavailable until the Supabase setup is complete.</p>';return}
 if(!data||!data.length){box.innerHTML='<p class="mu">No documents uploaded yet.</p>';return}
 box.innerHTML=data.map(d=>`<div class="row"><span>${esc(d.file_name)}<br><span class="mu">${esc(d.document_type.replaceAll('_',' '))} · ${esc(new Date(d.created_at).toLocaleDateString('en-GB'))}</span></span><button class="g s" onclick="viewStaffDoc('${d.id}')">View</button></div>`).join('');
}
async function viewStaffDoc(id){
 const {data,error}=await sb.from('staff_documents').select('storage_path,mime_type,file_name').eq('id',id).maybeSingle();
 if(error||!data){stat('Unable to access that document');return}
 const {data:link,error:linkErr}=await sb.storage.from('staff-documents').createSignedUrl(data.storage_path,60,{download:false});
 if(linkErr||!link?.signedUrl){stat('Unable to open document');return}
 const w=window.open(link.signedUrl,'_blank','noopener,noreferrer');
 if(!w)stat('Allow pop-ups to view this document. The secure link expires after 60 seconds.');
}
async function saveOnboardingAndContinue(){
 const err=$('#onb_err'),cb=$('#j_consent');err.textContent='';
 if(!cb||!cb.checked){err.textContent='Please confirm the information-use statement before continuing.';return}
 const o={};for(const f of JF){if(f==='chips'||f.length===1)continue;const el=$('#j_'+f[0]);o[f[0]]=el?el.value.trim():''}
 o.skills=[...document.querySelectorAll('#view .chips input:checked')].map(x=>x.value);o.consent='yes';
 if(!o.name||!o.phone||!o.email||!o.addr||!o.dob||!o.ni||!o.rtw||!o.kn||!o.kr||!o.kp||!o.trade){err.textContent='Complete all personal, contact, right-to-work, emergency contact and trade fields first.';return}
 const {data:docs,error:docErr}=await sb.from('staff_documents').select('id,document_type').eq('user_id',ME.id);
 if(docErr){err.textContent='Document system is not configured yet. Ask the administrator to run the supplied Supabase setup SQL.';return}
 if(!docs||!docs.some(d=>d.document_type==='right_to_work')){err.textContent='Upload your right-to-work evidence before continuing.';return}
 const {error}=await sb.from('onboarding').upsert({user_id:ME.id,data:o,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error){err.textContent='Could not save: '+error.message;return}
 MYDET={data:o};if(ME.approved){mode='operative';tab='mytasks'}else{mode='pending'}render();
}
function detailsView(){const sv=(MYDET&&MYDET.data)||{};let h='<h3>My details</h3><p class="mu">Your boss uses these for your pay and for emergencies. Only you and your boss can see them.</p>',open=false;
for(const f of JF){if(f==='chips'){h+='<label>Tap everything you can do</label><div class="chips">'+SKL.map(k=>{const on=(sv.skills||[]).includes(k);return`<label class="${on?'on':''}"><input type="checkbox" value="${k}"${on?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${k}</label>`}).join('')+'</div>';continue}
if(f.length===1){h+=(open?'</div>':'')+`<div class="card"><h3>${f[0]}</h3>`;open=true;continue}
const[id,l,t]=f,x=sv[id]??'';h+=`<label>${l}</label>`+(t==='area'?`<textarea id="j_${id}" rows="2">${esc(x)}</textarea>`:t&&t.startsWith('sel:')?`<select id="j_${id}">${t.slice(4).split(',').map(o=>`<option${o===x?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="j_${id}" type="${t||'text'}" value="${esc(x)}">`)}
$('#view').innerHTML=h+'</div><p class="err" id="jerr"></p><button onclick="detSave()">Save my details</button><p class="mu" id="jok"></p>'}
async function detSave(){const o={};for(const f of JF){if(f==='chips'||f.length===1)continue;o[f[0]]=$('#j_'+f[0]).value.trim()}
o.skills=[...document.querySelectorAll('#view .chips input:checked')].map(x=>x.value);
if(!o.name||!o.phone||!o.kn||!o.kp||!o.trade){$('#jerr').textContent='Please fill in everything marked *.';return}$('#jerr').textContent='';
const{error}=await sb.from('onboarding').upsert({user_id:ME.id,data:o,updated_at:new Date().toISOString()});if(error){$('#jerr').textContent=error.message;return}MYDET={data:o};$('#jok').textContent='Saved. Your boss can now see them.'}
// ---- main render
function render(){const inApp=mode==='owner'||mode==='operative',nav=$('#nav'),v=$('#view');
$('#top').style.display=(inApp||mode==='pending')?'flex':'none';$('#who').textContent=ME?(ME.full_name||ME.email):'';
const items=mode==='owner'?OWN:mode==='operative'?OPN:[];nav.style.display=items.length?'':'none';nav.innerHTML=items.map(([k,l,i])=>`<button data-t="${k}" class="${tab===k?'on':''}">${ico(i||k)}<span>${l}</span></button>`).join('');
$('#rems').innerHTML=mode==='owner'&&!FM?reminders().slice(0,3).map(r=>`<div class="rem"><span>${esc(r.t)}</span>${r.id?`<a data-d="${r.id}">✕</a>`:''}</div>`).join(''):'';
if(mode==='setup')return setupView();if(mode==='boot'){v.innerHTML='<div class="card mu">Loading…</div>';return}if(mode==='auth')return authView();if(mode==='recover')return recoverView();if(mode==='pending')return pendingView();if(mode==='onboarding')return onboardingView();
if(FM)return paintForm();
if(mode==='operative'){if(tab==='mypay')return myPayView();if(tab==='mydetails')return detailsView();return myTasksView()}
if(tab==='home')return homeView();if(tab==='jobs')return jobsView();if(tab==='tasks')return tasksView();if(tab==='pay')return payView();if(tab==='quotes')return quotesView();if(tab==='money')return moneyView();return teamView()}
async function poll(){if(document.hidden||FM||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;try{if(mode==='owner'){await loadOps();if(tab==='tasks'||tab==='today')render()}else if(mode==='operative'){await loadOp();if(tab==='mytasks'||tab==='mypay')render()}else if(mode==='pending'&&ME){await enter({id:ME.id})}}catch(e){}}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t){FM=null;FIT=null;tab=b.dataset.t;render();$('#view').scrollTop=0}};
$('#rems').onclick=e=>{const id=e.target.dataset?.d;if(id){S.rem=S.rem.filter(r=>r.id!==id);save();render()}};
$('#so').onclick=signOut;
setInterval(poll,60000);
boot();

</script></body></html>
